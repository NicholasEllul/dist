name: "Hash FOO Secret"
description: "Computes the SHA-1 of the provided FOO secret"

inputs:
  foo:
    description: "The FOO secret to hash"
    required: true

outputs:
  foo_sha1:
    description: "SHA1 hash of the FOO secret"
    value: ${{ steps.hash.outputs.foo_sha1 }}

runs:
  using: "composite"
  steps:
    - name: Compute SHA1 of FOO
      id: hash
      shell: bash
      run: |
        SHA1=$(printf "%s" "${{ inputs.foo }}" | sha1sum | awk '{print $1}')
        echo "foo_sha1=$SHA1" >> "$GITHUB_OUTPUT"
