name: "Hash FOO Secret"
description: "Computes the SHA-1 of the provided FOO secret"
inputs:
  foo:
    description: "The FOO secret to hash"
    required: true

runs:
  using: "composite"
  steps:
    - name: Compute SHA1 of FOO
      shell: bash
      run: |
        # Compute SHA1
        SHA1=$(printf "%s" "${{ inputs.foo }}" | sha1sum | awk '{print $1}')
